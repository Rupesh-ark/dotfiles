# -----------------------------------------------------------------------------
# VISUAL SETTINGS
# -----------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font Propo
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
disable_ligatures no

shell zsh
shell_integration disabled
cursor_shape block
url_style curly

# Transparency & blur
background_opacity 0.85
background_blur 32

# Padding (essential for that clean look)
window_padding_width 12 16

# Tab bar - Gruvbox styled
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
tab_title_max_length 30
tab_title_template        "{fmt.fg.color3}{bell_symbol}{activity_symbol}{fmt.fg.default}{index}: {title.split('/')[-1] if '/' in title else title}"
active_tab_title_template  "{fmt.fg._1d2021}{bell_symbol}{activity_symbol}{index}: {title.split('/')[-1] if '/' in title else title}"
active_tab_foreground #1d2021
active_tab_background #fabd2f
active_tab_font_style bold
inactive_tab_foreground #a89984
inactive_tab_background #3c3836
inactive_tab_font_style normal
tab_bar_background #282828

# Window splits
active_border_color #fabd2f
inactive_border_color #504945
window_border_width 1.5pt
draw_minimal_borders yes
window_margin_width 2

# -----------------------------------------------------------------------------
# BEHAVIOR
# -----------------------------------------------------------------------------
enable_audio_bell no
remember_window_size no
sync_to_monitor no
confirm_os_window_close 0

# Copy/Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# -----------------------------------------------------------------------------
# COLORS: Gruvbox Dark Medium
# -----------------------------------------------------------------------------

background  #282828
foreground  #ebdbb2

# Cursor colors
cursor                #ebdbb2
cursor_text_color     #282828

# Selection colors
selection_foreground  #ebdbb2
selection_background  #504945

# URL underline color
url_color #83a598

# The 16 terminal colors

# black
color0  #282828
color8  #928374

# red
color1  #cc241d
color9  #fb4934

# green
color2  #98971a
color10 #b8bb26

# yellow
