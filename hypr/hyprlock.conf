# Hyprlock — Matrix Gruvbox Theme
$wallpaper = ~/Pictures/wallpaper.png

background {
    monitor =
    path = $wallpaper
    color = rgba(29, 32, 33, 1.0)
    blur_passes = 4
    blur_size = 6
    brightness = 0.4
}

general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# --- MATRIX RAIN (background layer) ---

# Main matrix rain — Gruvbox rotating color (fullscreen)
label {
    monitor =
    text = cmd[update:150] python3 ~/.config/hypr/scripts/matrix_rain.py
    color = rgba(184, 187, 38, 0.4)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 0
    halign = fill
    valign = fill
}

# --- DATE & TIME ---

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(235, 219, 178)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = rgb(250, 189, 47)
    font_size = 95
    font_family = JetBrainsMono NF ExtraBold
    position = 0, 100
    halign = center
    valign = center
}

# --- INPUT FIELD ---

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(184, 187, 38, 0.6)
    inner_color = rgba(29, 32, 33, 0.7)
    font_color = rgb(184, 187, 38)
    check_color = rgb(250, 189, 47)
    fail_color = rgb(204, 36, 29)
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

# --- USERNAME ---

label {
    monitor =
    text = cmd[update:1000] echo "Logged in as $(whoami)"
    color = rgb(168, 153, 132)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

# --- BATTERY (Top Right) ---

label {
    monitor =
    text = cmd[update:1000] echo "$(cat /sys/class/power_supply/BAT0/capacity | awk '{if ($1 > 80) print "  "$1"%"; else if ($1 > 50) print "  "$1"%"; else if ($1 > 20) print "  "$1"%"; else print "  "$1"%"}')"
    color = rgb(254, 128, 25)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = -40, -40
    halign = right
    valign = top
}
